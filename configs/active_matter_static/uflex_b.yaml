# UFlex-B · The Well · active_matter, static prediction: u(0) -> u(horizon)
#   python train_static.py --config configs/active_matter_static/uflex_b.yaml

# Experiment
seed: 40
device: "cuda:0"
wandb_project: UFlex
wandb_entity: null             # your W&B team; null uses your default entity
tags: [active_matter, static]
output_dir: checkpoints        # checkpoints go to <output_dir>/<run name>/

# Data
dataset_name: "active_matter"
data_path: "data/the_well/datasets"
input_steps: 1                 # the initial condition only
horizon: 10                    # target is the state `horizon` steps after the input
stride: 1                      # temporal stride between frames

# Per-channel normalization statistics of the training set
mean: [1.0, 2.902884963656982e-12, -8.958896818844764e-11, 0.5019016861915588, -0.006248312070965767, -0.006248312070965767, 0.49809831380844116, 2.2169193564236522e-12, -4.510158219117599e-11, -4.510158219117599e-11, -2.2169193564236522e-12]
std: [0.002970081055536866, 0.5771536827087402, 0.5669324398040771, 0.31998544931411743, 0.33093005418777466, 0.33093005418777466, 0.32003045082092285, 0.4071103036403656, 0.4320834279060364, 0.4320834279060364, 0.4071103036403656]
log_scale: false               # symmetric log transform after normalization

# Model (keyword arguments of uflex.UFlex; channels and resolution are read from the data)
model:
  patch_size: [8, 8]
  depth: 2
  depth_res: 2
  depth_middle: 2
  heads: [8, 12]
  heads_middle: 18
  dim_head: 64
  downsampling_factor: 4
  num_parameters: 3
  dropout: false
  drop_path: 0.0

# Optimization
epochs: 100
batch_size: 32
accumulation_steps: 1
lr: 5.0e-04
learning_rate_min: 1.0e-06
weight_decay: 0.0
warmup_steps: 1000
beta1: 0.9
beta2: 0.95
mixed_precision: true          # bfloat16 autocast
compile: false
ema_decay: 0.998               # null disables the weight EMA
val_interval: 1                # validate every N epochs
