# UFlex-B · PDEBench · 2D compressible Navier-Stokes, turbulent (512x512, 4 fields)
#   python train.py --config configs/cns_2d/uflex_b.yaml

# Experiment
seed: 42
device: "cuda:0"
wandb_project: UFlex
wandb_entity: null             # your W&B team; null uses your default entity
tags: [cns_2d]
output_dir: checkpoints        # checkpoints go to <output_dir>/<run name>/

# Data
dataset_name: "CNS2d"
data_path: "data/pdebench/2D/CFD/2D_Train_Turb"
input_steps: 1                 # input frames given to the model
rollout_steps: 20              # length of the evaluation rollout
stride: 1                      # temporal stride between frames
rollout_error_space: normalized  # rollout error on normalized or physical fields

# Per-channel normalization statistics of the training set
mean: [-0.00042641, 2.031e-05, 1.0, 31.035]
std: [0.7304, 0.7303, 0.2617, 29.6706]
log_scale: false               # symmetric log transform after normalization

# Model (keyword arguments of uflex.UFlex; channels and resolution are read from the data)
model:
  patch_size: [8, 8]
  depth: 2
  depth_res: 2
  depth_middle: 2
  heads: [8, 12]
  heads_middle: 18
  dim_head: 64
  downsampling_factor: 4
  num_parameters: 1
  dropout: false
  drop_path: 0.0

# Optimization
epochs: 10
batch_size: 16
accumulation_steps: 2
lr: 5.0e-04
learning_rate_min: 1.0e-06
weight_decay: 0.0
warmup_steps: 1000
beta1: 0.9
beta2: 0.95
mixed_precision: true          # bfloat16 autocast
compile: false
ema_decay: 0.998               # null disables the weight EMA
val_interval: 1                # validate every N epochs
