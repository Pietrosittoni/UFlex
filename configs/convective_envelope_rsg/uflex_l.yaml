# UFlex-L · The Well · convective_envelope_rsg (3D, 256x128x256, 6 fields)
#   python train.py --config configs/convective_envelope_rsg/uflex_l.yaml
# Same data and optimization settings as uflex_b.yaml; only the model size differs.

base_config: uflex_b.yaml
tags: [convective_envelope_rsg, uflex_l]

model:
  patch_size: [16, 8, 16]
  depth: 2
  depth_res: 3
  depth_middle: 4
  heads: [12, 16]
  heads_middle: 24
  dim_head: 64
  downsampling_factor: 4
  num_parameters: 0
  dropout: false
  drop_path: 0.0
